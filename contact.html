<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لويالتي - تواصل معنا</title>
  <meta name="description" content="لويالتي - تواصل معنا">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">لويالتي</a>
      <nav class="nav" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="products.html">المنتجات</a>
        <a href="contact.html" aria-current="page">تواصل معنا</a>
        <a href="cart.html" aria-label="سلة التسوق">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1 class="section-title">تواصل معنا</h1>
        <p class="section-subtitle">يسعدنا تواصلك معنا لأي استفسار أو اقتراح</p>

        <div class="contact-content">
          <div class="contact-info">
            <h2 class="contact-info-title">معلومات التواصل</h2>
            <p class="contact-info-text">
              فريقنا متاح للإجابة على استفساراتك ومساعدتك في أي وقت.
              يمكنك التواصل معنا عبر النموذج أو عبر قنواتنا الرسمية.
            </p>
          </div>

          <form id="contact-form" class="contact-form" novalidate>
            <div class="form-group">
              <label for="contact-name" class="form-label">الاسم <span class="required">*</span></label>
              <input type="text" id="contact-name" name="name" class="form-input" required autocomplete="name">
              <p class="field-error" id="error-name" hidden></p>
            </div>

            <div class="form-group">
              <label for="contact-email" class="form-label">البريد الإلكتروني (اختياري)</label>
              <input type="email" id="contact-email" name="email" class="form-input" autocomplete="email" dir="ltr">
              <p class="field-error" id="error-email" hidden></p>
            </div>

            <div class="form-group">
              <label for="contact-subject" class="form-label">موضوع الرسالة <span class="required">*</span></label>
              <input type="text" id="contact-subject" name="subject" class="form-input" required>
              <p class="field-error" id="error-subject" hidden></p>
            </div>

            <div class="form-group">
              <label for="contact-message" class="form-label">تفاصيل الرسالة <span class="required">*</span></label>
              <textarea id="contact-message" name="message" class="form-input" rows="5" required></textarea>
              <p class="field-error" id="error-message" hidden></p>
            </div>

            <p class="field-error" id="contact-form-error" hidden></p>
            <button type="submit" class="btn btn-primary contact-submit" id="contact-submit-btn">إرسال الرسالة</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span class="footer-text">لويالتي &copy; 2026</span>
      <nav class="footer-links" aria-label="روابط التذييل">
        <a href="products.html">المنتجات</a>
        <a href="contact.html">تواصل معنا</a>
      </nav>
    </div>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
